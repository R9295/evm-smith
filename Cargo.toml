[package]
name = "evm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"
required-features = ["rng"]

[dependencies]
alloy-primitives = "1.5.7"
anyhow = "1.0.102"
arbitrary = { version = "1.4.2", optional = true, features = ["derive"] }
clap = { version = "4", features = ["derive"] }
fastrand = { version = "2.4.1", optional = true }
revm = "38"
secp256k1 = "0.30"
serde_json = "1"

[features]
rng = ["dep:fastrand"]
arbitrary = ["dep:arbitrary"]
